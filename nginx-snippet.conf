# ---------------------------------------------------------------------------
# nginx snippet for sb-ech-gateway
#
# The installer injects this automatically into the HTTPS (443) server block of
# your panel domain and rolls back if `nginx -t` fails. Add it by hand only if
# you install with --no-nginx.
#
#   /sb/<secret>/auto/<subid>    -> format picked from the User-Agent
#   /sb/<secret>/sub/<subid>     -> sing-box profile, live ECH from DNS
#   /sb/<secret>/subs/<subid>    -> sing-box profile, static ECH (PEM)
#   /sb/<secret>/clash/<subid>   -> mihomo / Clash.Meta YAML (ech-opts)
#   /sb/<secret>/xray/<subid>    -> the panel's raw subscription
#   /sb/<secret>/health          -> status JSON
# ---------------------------------------------------------------------------

location /sb/ {
    proxy_pass http://127.0.0.1:2199;   # change the port if you set another one
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;

    # never cache subscription bodies: ECH keys rotate
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
}

# Notes
#  * Your panel domain may sit behind Cloudflare (orange cloud) - that is fine,
#    subscription fetching through the CDN works exactly like the panel's own subs.
#  * The gateway binds to 127.0.0.1 only; do not expose port 2199 publicly.
