# ---------------------------------------------------------------------------
# nginx snippet for sb-ech-gateway
#
# The installer never edits nginx: it prints this block at the end (and saves an
# identical copy to the install directory as nginx-location.conf, so you can also
# use:  include /opt/sb-ech-gateway/nginx-location.conf;
# Paste it inside the HTTPS (443) server block of your panel domain, then run:
#   nginx -t && systemctl reload nginx
# (--auto-nginx makes the installer do that for you; it is off by default.)
#
#   /sb/<secret>/auto/<subid>    -> format picked from the User-Agent
#   /sb/<secret>/sub/<subid>     -> sing-box profile, live ECH from DNS
#   /sb/<secret>/subs/<subid>    -> sing-box profile, static ECH (PEM)
#   /sb/<secret>/clash/<subid>   -> mihomo / Clash.Meta YAML (ech-opts)
#   /sb/<secret>/xray/<subid>    -> the panel's raw subscription
#   /sb/<secret>/health          -> status JSON
# ---------------------------------------------------------------------------

location /sb/ {
    proxy_pass http://127.0.0.1:2199;   # change the port if you set another one
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;

    # never cache subscription bodies: ECH keys rotate
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
}

# Notes
#  * Your panel domain may sit behind Cloudflare (orange cloud) - that is fine,
#    subscription fetching through the CDN works exactly like the panel's own subs.
#  * The gateway binds to 127.0.0.1 only; do not expose port 2199 publicly.
