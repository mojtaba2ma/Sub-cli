name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: vet + build
        run: |
          go vet ./...
          go build -trimpath -ldflags "-s -w" -o sb-ech-gateway .

      - name: cross compile
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/sb-ech-gateway-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o dist/sb-ech-gateway-linux-arm64 .
          cd dist && sha256sum sb-ech-gateway-linux-* > SHA256SUMS

      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sb-ech-gateway-linux-amd64
            dist/sb-ech-gateway-linux-arm64
            dist/SHA256SUMS
          generate_release_notes: true
